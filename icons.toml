# The icon set.
#
# Curated, not exhaustive. Upstream ships over two thousand glyphs; the
# reference CMS bundles about that many and its own modules use 47 of them.
# Shipping the long tail costs every consumer and serves almost nobody, so a
# name earns its place here or a plugin registers its own.
#
# Admission rules:
#   * One icon per concept. No `mail` AND `envelope`; no `pencil` AND `pen`.
#     This single rule does more against bloat than any quota.
#   * Every group carries its evidence: why these, not someone's taste.
#   * Out by category: brands, weather, faces, sports, food, animals.
#   * A group past roughly twenty entries is a signal to prune, not to add.
#
# `fillable` marks closed shapes that read correctly filled, which is how a
# state is shown (a filled star is favourited). There is no `-solid` name and
# no variant field: filling is a render option, never something an author types.
#
# `mirror` marks icons whose direction carries meaning and which flip under
# a right-to-left layout.
#
# Generated artefacts come from this file; edit it, then run
# scripts/gen-icons.py.

upstream = "lucide"
upstream_version = "1.46.0"

[chrome]
# The panel's own furniture: every one is rendered by Laterite itself or by a screen it ships.
# 48 icons.
icons = [
  "arrow-up-down",  # mirror
  "check",
  "chevron-down",
  "chevron-left",  # mirror
  "chevron-right",  # mirror
