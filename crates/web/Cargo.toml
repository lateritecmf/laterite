[package]
name = "laterite-web"
version = "0.9.16"
description = "Laterite CMF public web layer: themes, static-site generation, page metadata, canonical URLs, and sitemaps"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laterite-core = { workspace = true }
laterite-auth = { workspace = true }
laterite-admin = { workspace = true }
laterite-media = { workspace = true }
anyhow = { workspace = true }
askama = { workspace = true }
chrono = { workspace = true }
minijinja = { version = "3", features = ["serde", "fuel"] }
regex = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
laterite-core = { workspace = true, features = ["testing"] }
zip = { version = "9", default-features = false }
tower = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
