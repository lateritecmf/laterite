[package]
name = "laterite-settings"
version = "0.1.0"
description = "Laterite CMF settings: typed settings models stored as one JSON value per code"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laterite-core = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
postgres = ["laterite-core/postgres"]
mysql = ["laterite-core/mysql"]
sqlite = ["laterite-core/sqlite"]

[dev-dependencies]
laterite-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
