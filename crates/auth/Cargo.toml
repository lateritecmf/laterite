[package]
name = "laterite-auth"
version = "0.1.0"
description = "Laterite CMF backend user authentication: Argon2id credentials, sessions, and role-based permissions"
edition.workspace = true
license.workspace = true

[dependencies]
laterite-core = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
postgres = ["laterite-core/postgres"]
mysql = ["laterite-core/mysql"]
sqlite = ["laterite-core/sqlite"]

[dev-dependencies]
laterite-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
