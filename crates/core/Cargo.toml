[package]
name = "laterite-core"
version = "0.9.20"
description = "Laterite CMF application kernel: config, errors, database, migrations, modules"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
laterite-macros = { workspace = true }
email_address = "0.2.9"
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
unicode-normalization = { workspace = true }
pulldown-cmark = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, optional = true }

[features]
default = []
# Database drivers. A deployment enables exactly the one(s) it runs against, so
# only that driver is compiled in. Nothing is on by default.
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
# The multi-backend test harness (`laterite_core::testing`). Enabled by crates'
# dev-dependencies, never in a production build.
testing = ["dep:tokio", "dep:uuid"]

[dev-dependencies]
serde_json.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true }
