[package]
name = "lateritecmf"
version = "0.9.23"
description = "Laterite CMF: the one crate an application depends on, re-exporting the framework with its driver features"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laterite-core = { workspace = true }
laterite-auth = { workspace = true }
laterite-admin = { workspace = true }
laterite-media = { workspace = true }
laterite-web = { workspace = true }

[features]
default = []
postgres = ["laterite-admin/postgres"]
mysql = ["laterite-admin/mysql"]
sqlite = ["laterite-admin/sqlite"]
s3 = ["laterite-media/s3"]
