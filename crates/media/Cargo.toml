[package]
name = "laterite-media"
version = "0.9.22"
description = "Laterite media: content-addressed blob storage with streaming ingest"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laterite-core = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
img-parts = { workspace = true }
# Content types are sniffed from the bytes, never taken from the client.
infer = "0.16"
# An SVG upload is cleaned to a drawing before it is stored.
ammonia = { workspace = true }
# The schema identifier enum uses sea-query's `Iden` derive, whose generated code
# names the `sea_query` crate directly. The framework re-exports the types through
# `strata`, but the derive still needs the crate as a direct dependency.
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# ReaderStream: a file becomes a byte stream without a buffering step.
tokio-util = { version = "0.7", features = ["io"] }
tracing = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }

[features]
default = []
# The S3-compatible disk (`S3Disk`): AWS S3, Cloudflare R2, MinIO, Backblaze
# B2, DigitalOcean Spaces, Wasabi, through an endpoint override.
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-credential-types"]
postgres = ["laterite-core/postgres"]
mysql = ["laterite-core/mysql"]
sqlite = ["laterite-core/sqlite"]

[dev-dependencies]
laterite-core = { workspace = true, features = ["sqlite", "testing"] }
tempfile = { workspace = true }
tokio = { workspace = true }
