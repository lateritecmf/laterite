<div class="lat-card">
  <form method="post" action="{{ action }}" enctype="multipart/form-data" data-lat-widget="form" data-lat-confirm-leave="off">
    <input type="hidden" name="_csrf" value="{{ shell.csrf_token() }}">
    <div class="lat-fields">
      <div class="lat-field">
        <label class="lat-field__label" for="file">{{ shell.t("File") }}<span class="lat-field__req">*</span></label>
        <input class="lat-input" type="file" id="file" name="file" accept=".csv,text/csv" required>
        <p class="lat-help">{{ shell.t("A CSV file, read as UTF-8.") }}</p>
      </div>
      <div class="lat-field">
        <label class="lat-check"><input type="checkbox" name="titles" value="1" checked> {{ shell.t("The first row holds the column titles") }}</label>
      </div>
      <div class="lat-field">
        <label class="lat-field__label" for="delimiter">{{ shell.t("Values are separated by") }}</label>
        <select class="lat-input lat-select" id="delimiter" name="delimiter">
          <option value=",">{{ shell.t("Comma") }}</option>
          <option value=";">{{ shell.t("Semicolon") }}</option>
          <option value="tab">{{ shell.t("Tab") }}</option>
        </select>
      </div>
    </div>
    <div class="lat-actions">
      <button class="lat-btn lat-btn--primary" type="submit">{{ shell.t("Continue") }}</button>
      <a class="lat-btn lat-btn--ghost" href="{{ back }}">{{ shell.t("Cancel") }}</a>
    </div>
  </form>
</div>
