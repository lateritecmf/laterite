<div class="lat-card">
  <dl class="lat-facts">
    <div><dt>{{ shell.t("Resource") }}</dt><dd>{{ resource }}</dd></div>
    <div><dt>{{ shell.t("Started") }}</dt><dd>{{ started_at }}</dd></div>
    <div><dt>{{ shell.t("By") }}</dt><dd>{{ actor }}</dd></div>
  </dl>
</div>
{{ status|safe }}
<div class="lat-actions">
  <a class="lat-btn lat-btn--ghost" href="{{ back }}">{{ shell.t("Back to import") }}</a>
</div>
