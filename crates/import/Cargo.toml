[package]
name = "laterite-import"
version = "0.9.8"
description = "Laterite bulk import: a file's rows written through a resource's form, with a report"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io yet: the first version goes up by hand once the slice it
# belongs to is released, and this line goes with it.
publish = false

[dependencies]
laterite-core = { workspace = true }
laterite-admin = { workspace = true }
laterite-media = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
futures = { workspace = true }
# The schema identifier enum uses sea-query's `Iden` derive, whose generated code
# names the `sea_query` crate directly.
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = []
postgres = ["laterite-core/postgres", "laterite-admin/postgres"]
mysql = ["laterite-core/mysql", "laterite-admin/mysql"]
sqlite = ["laterite-core/sqlite", "laterite-admin/sqlite"]

[dev-dependencies]
laterite-core = { workspace = true, features = ["sqlite", "testing"] }
laterite-auth = { workspace = true }
tokio = { workspace = true }
