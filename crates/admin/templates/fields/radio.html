<div class="lat-radios">
  {% for o in options %}
  <label class="lat-check"><input type="radio" name="{{ name }}" value="{{ o.value }}"{% if o.selected %} checked{% endif %}{% if required %} required{% endif %}{% if o.disabled %} disabled{% endif %}> {{ o.label }}{% if let Some(note) = o.note %}<span class="lat-checklist__note">{{ note }}</span>{% endif %}</label>
  {% endfor %}
</div>
