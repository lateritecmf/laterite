<div class="lat-markdown{% if data.side %} lat-markdown--side{% endif %}" data-lat-widget="markdown"{% if data.side %} data-layout="side"{% endif %} data-pick="{{ data.pick_url }}" data-menu="{{ data.menu_url }}"{% if let Some(u) = data.preview_url %} data-preview="{{ u }}"{% endif %}{% if let Some(r) = data.rows %} style="--rows:{{ r }}"{% endif %}{% for (k, v) in data.words %} data-w-{{ k }}="{{ v }}"{% endfor %}>
  <div class="lat-markdown__bar" role="toolbar" aria-label="{{ data.toolbar_label }}">
    {% if data.preview_url.is_some() && !data.side %}<div class="lat-markdown__tabs" role="tablist"><button type="button" class="lat-markdown__tab is-on" role="tab" aria-selected="true" data-md-tab="write">{{ data.write }}</button><button type="button" class="lat-markdown__tab" role="tab" aria-selected="false" data-md-tab="preview">{{ data.preview }}</button></div>{% endif %}
    <span class="lat-markdown__spacer"></span>
    {% for b in data.buttons %}<button type="button" class="lat-markdown__btn" data-md-cmd="{{ b.cmd }}" aria-label="{{ b.label }}" data-lat-tooltip="{{ b.label }}"{% if b.cmd == "insert" %} hidden{% endif %}>{{ b.icon|safe }}</button>{% endfor %}
  </div>
  <div class="lat-markdown__body" data-md-body></div>
  {% if data.preview_url.is_some() %}<div class="lat-markdown__preview lat-prose" data-md-preview aria-live="polite" aria-label="{{ data.preview }}"{% if !data.side %} hidden{% endif %}></div>{% endif %}
  <textarea class="lat-input lat-editor" id="{{ id }}" name="{{ name }}" data-lat-grow="off"{% if let Some(r) = data.rows %} rows="{{ r }}"{% endif %}{% if let Some(p) = data.placeholder %} placeholder="{{ p }}"{% endif %}{% if required %} required{% endif %}>{{ value }}</textarea>
</div>
