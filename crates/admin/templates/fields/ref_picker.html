<div class="lat-refpicker" data-lat-widget="ref-picker" data-search="{{ search_url }}" data-resolve="{{ resolve_url }}">
  <input type="hidden" name="{{ name }}" value="{{ value }}" data-refpicker-id>
  <input class="lat-input" type="text" id="{{ id }}" autocomplete="off" placeholder="{{ placeholder }}" data-refpicker-search>
  <span class="lat-refpicker__caret" aria-hidden="true">&#9660;</span>
  <ul class="lat-refpicker__menu" data-refpicker-menu hidden></ul>
</div>
