<div class="lat-input-group lat-sensitive" data-lat-widget="sensitive" data-field="{{ name }}" data-failed="{{ failed }}"{% if has_value %} data-has-value{% endif %}>
<input class="lat-input" type="text" id="{{ id }}" name="{{ name }}" value="{{ value }}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore{% if required %} required{% endif %}>
<button type="button" class="lat-input-group__btn lat-sensitive__btn" aria-label="{{ reveal }}" data-lat-tooltip="{{ reveal }}" aria-pressed="false"></button>
</div>
