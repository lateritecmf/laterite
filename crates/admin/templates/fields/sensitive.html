<div class="lat-input-group lat-sensitive" data-lat-widget="sensitive" data-field="{{ name }}" data-failed="{{ failed }}"{% if has_value %} data-has-value{% endif %}>
<input class="lat-input" type="password" id="{{ id }}" name="{{ name }}" value="{{ value }}" autocomplete="off" spellcheck="false"{% if required %} required{% endif %}>
<button type="button" class="lat-input-group__btn lat-sensitive__btn" aria-label="{{ reveal }}" aria-pressed="false" hidden>{{ reveal }}</button>
</div>
