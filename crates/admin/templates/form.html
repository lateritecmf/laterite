<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - Laterite</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
    .bar { background: #fff; border-bottom: 1px solid #e5e5ea; padding: .9rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .bar a { color: #b7410e; text-decoration: none; font-size: .85rem; }
    h1 { font-size: 1.1rem; margin: 0; }
    .content { padding: 1.5rem; max-width: 560px; }
    .card { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    label { display: block; font-size: .85rem; margin: 0 0 .25rem; }
    input[type=text], textarea { width: 100%; padding: .55rem .6rem; margin-bottom: 1rem; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; font: inherit; }
    textarea { min-height: 6rem; }
    .actions { display: flex; gap: .75rem; align-items: center; }
    button { background: #b7410e; color: #fff; border: 0; padding: .6rem 1rem; border-radius: 8px; cursor: pointer; font-size: .95rem; }
    .actions a { color: #6e6e73; text-decoration: none; font-size: .9rem; }
    .error { background: #fde8e8; color: #9b1c1c; padding: .6rem .75rem; border-radius: 8px; margin-bottom: 1rem; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="bar"><a href="{{ cancel_path }}">&larr; Back</a><h1>{{ title }}</h1></div>
  <div class="content">
    <div class="card">
      {% if let Some(message) = error %}<div class="error">{{ message }}</div>{% endif %}
      <form method="post" action="{{ action }}">
        {% for field in fields %}
        <label for="{{ field.name }}">{{ field.label }}</label>
        {% if field.textarea %}
        <textarea id="{{ field.name }}" name="{{ field.name }}"{% if field.required %} required{% endif %}>{{ field.value }}</textarea>
        {% else %}
        <input type="text" id="{{ field.name }}" name="{{ field.name }}" value="{{ field.value }}"{% if field.required %} required{% endif %}>
        {% endif %}
        {% endfor %}
        <div class="actions">
          <button type="submit">Save</button>
          <a href="{{ cancel_path }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
