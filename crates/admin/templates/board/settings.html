<form method="post" action="" data-carried="{{ carried }}" data-reload="{{ reload }}" data-lat-widget="form" data-lat-board-settings><input type="hidden" name="_csrf" value="{{ shell.csrf_token() }}"><input type="hidden" name="layout" value=""><div class="lat-dialog__head"><h2>{{ title }}</h2><button type="button" class="lat-dialog__close" data-lat-dialog-close aria-label='{{ shell.t("Close") }}'>&times;</button></div><div class="lat-dialog__body">{{ fields|safe }}</div><div class="lat-dialog__actions"><button class="lat-btn lat-btn--ghost" type="button" data-lat-dialog-close>{{ shell.t("Cancel") }}</button><button class="lat-btn lat-btn--primary" type="submit">{{ shell.t("Apply") }}</button></div></form>
