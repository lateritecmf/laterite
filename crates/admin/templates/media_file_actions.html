<a class="lat-btn lat-btn--secondary lat-btn--sm" href="{{ url }}" target="_blank" rel="noopener"><span class="lat-btn__icon">{{ shell.icon("external-link")|safe }}</span>{{ shell.t("Open") }}</a>
{% if may_crop %}<button type="button" class="lat-btn lat-btn--secondary lat-btn--sm" data-lat-dialog="crop-image"><span class="lat-btn__icon">{{ shell.icon("square")|safe }}</span>{{ shell.t("Crop") }}</button>{% endif %}
{% if may_manage %}
<form method="post" action="{{ file_href }}/{% if protected %}make-public{% else %}make-private{% endif %}"><input type="hidden" name="_csrf" value="{{ shell.csrf_token() }}"><button class="lat-btn lat-btn--secondary lat-btn--sm" type="submit"><span class="lat-btn__icon">{% if protected %}{{ shell.icon("lock-open")|safe }}{% else %}{{ shell.icon("lock")|safe }}{% endif %}</span>{% if protected %}{{ shell.t("Make public") }}{% else %}{{ shell.t("Make private") }}{% endif %}</button></form>
{% endif %}
{% if may_delete %}
<form method="post" action="{{ file_href }}/delete"><input type="hidden" name="_csrf" value="{{ shell.csrf_token() }}"><button class="lat-btn lat-btn--danger lat-btn--sm" type="submit" data-lat-confirm='{% if linked %}{{ shell.t("Records still use this file. Delete it anyway?") }}{% else %}{{ shell.t("Delete this file?") }}{% endif %}'>{{ shell.t("Delete") }}</button></form>
{% endif %}
