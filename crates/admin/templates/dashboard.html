{% extends "base.html" %}
{% block title %}Admin - Laterite{% endblock %}
{% block content %}
<h1>Welcome, {{ full_name }}</h1>
<p class="muted">Signed in as {{ username }}.</p>
{% for item in nav %}
<p><a href="{{ item.path }}">{{ item.label }} &rarr;</a></p>
{% endfor %}
<form method="post" action="/admin/logout">
  <button type="submit">Sign out</button>
</form>
{% endblock %}
