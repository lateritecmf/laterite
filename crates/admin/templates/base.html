<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Laterite{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
    .wrap { max-width: 420px; margin: 8vh auto; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: .85rem; margin: 0 0 .25rem; }
    input[type=text], input[type=password] { width: 100%; padding: .55rem .6rem; margin-bottom: 1rem; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; }
    button { background: #b7410e; color: #fff; border: 0; padding: .6rem 1rem; border-radius: 8px; cursor: pointer; font-size: .95rem; }
    .error { background: #fde8e8; color: #9b1c1c; padding: .6rem .75rem; border-radius: 8px; margin-bottom: 1rem; font-size: .85rem; }
    .muted { color: #6e6e73; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
