entity: posts
path: /posts
title: Posts
permission: acme.manage_posts
permissions:
  update: acme.edit_posts
abilities:
  describe: Blog posts, each with a code and a name.
  hide: [internal]
list:
  creatable: true
  deletable: true
  columns:
    code: {}
    name: {}
    internal: {}
  filters:
    name: { type: text }
    code: { type: select, options: [{ value: a, label: A }, { value: b, label: B }] }
    audit: { type: text, column: internal, permission: acme.audit_posts }
form:
  title: Post
  fields:
    code: { rules: [required, { max_length: 60 }] }
    name: { rules: [required] }
    internal: {}
