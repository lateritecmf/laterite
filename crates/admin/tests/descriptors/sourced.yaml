entity: teams
path: /sourced
title: Teams
permission: acme.manage_posts
list:
  columns:
    code: {}
  filters:
    code: { type: select, options: [{ value: abc }, { value: xyz }] }
    name: { type: select, options: acme.names, depends_on: code }
form:
  title: Team
  fields:
    code: { rules: [required] }
    name: { type: select, options: acme.names, depends_on: code }
    topics: { type: checklist, options: acme.names, depends_on: [code] }
    kind: { transient: true, type: select, options: [{ value: a-team }, { value: b-team }] }
    lead: { transient: true, type: select, options: acme.names, depends_on: kind }
