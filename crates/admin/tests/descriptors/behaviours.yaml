entity: backend_roles
path: /notes
title: Notes
permission: acme.manage_posts
list:
  columns:
    code: {}
form:
  title: Note
  confirm_leave: false
  focus: off
  actions:
    - { label: Reset to default, action: "acme/notes/{id}/reset", confirm: Reset this note? }
    - { label: Preview, action: "acme/notes/{id}/preview", method: get }
  fields:
    code: { rules: [required, { max_length: 60 }] }
    name: { rules: [{ max_length: 20 }], counter: true }
    description:
      type: textarea
      grow: false
      counter: false
      rules: [{ max_length: 500 }]
    permissions: { type: password, reveal: false }
