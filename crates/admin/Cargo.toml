[package]
name = "laterite-admin"
version = "0.1.0"
description = "Laterite CMF admin surface: the Axum router, session middleware, and login shell"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laterite-core = { workspace = true }
laterite-auth = { workspace = true }
laterite-settings = { workspace = true }
anyhow = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }

[features]
default = []
postgres = ["laterite-core/postgres", "laterite-auth/postgres", "laterite-settings/postgres"]
mysql = ["laterite-core/mysql", "laterite-auth/mysql", "laterite-settings/mysql"]
sqlite = ["laterite-core/sqlite", "laterite-auth/sqlite", "laterite-settings/sqlite"]

[dev-dependencies]
laterite-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
tower = { workspace = true }
