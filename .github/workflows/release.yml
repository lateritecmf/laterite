name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# A pushed `vX.Y.Z` tag is a release. The tag must equal the single workspace
# version and have a CHANGELOG section; the SQLite suite runs before anything
# irreversible; crates.io is published through Trusted Publishing (a short-lived
# token minted from this workflow's OIDC identity, so no API token is stored);
# then the GitHub release is created from the CHANGELOG section, marked
# pre-release when the tag carries a suffix. The Postgres and MariaDB suites run
# on every push to main. A crate's first version is published by hand, then its
# Trusted Publishing publisher (this repo, this workflow file, environment
# `release`) is added on crates.io.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag must equal the one workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versions="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)"
          if [ "$versions" != "$tag" ]; then
            echo "tag v$tag does not match the crate version(s): $versions"
            exit 1
          fi
      - name: The CHANGELOG must have a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: cargo test --workspace --features sqlite

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Laterite ${GITHUB_REF_NAME#v}" --notes-file notes.md "${flags[@]}"

  # The website builds its handbook and changelog from this repo, so a release
  # asks its deploy workflow to run (a repository_dispatch to the web repo, with
  # a token scoped to that repo). Skipped, not failed, when no token is set.
  website:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Ask laterite.rs to redeploy
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN is not set; the site was not redeployed."
            exit 0
          fi
          gh api repos/lateritecmf/web/dispatches -f event_type=framework-release \
            && echo "Site redeploy requested."
