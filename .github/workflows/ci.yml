name: CI

on:
  push:
    branches: [main]
  pull_request:

# Formatting and lints. The database test suites run in the per-backend
# workflows (sqlite.yml, postgres.yml, mysql.yml); clippy enables the SQLite
# driver so the test targets type-check without needing a database service.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features sqlite -- -D warnings

  # The third-party notice is generated from `cargo metadata` plus the bundled
  # asset list; fail if a dependency was added without regenerating it. An
  # unlisted crate is an unmet attribution obligation, not a formatting nit.
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The generator quotes each crate's own LICENSE file, so the sources have
      # to be on disk rather than just the index.
      - run: cargo fetch
      # A new crate cannot go unlisted: the notice is regenerated below and
      # drift fails the job. A new *asset* changes no manifest, so it needs its
      # own check; both halves of the obligation live in this one job.
      - name: Every bundled asset must be ours or attributed
        run: sh scripts/check-bundled-assets.sh
      - run: python3 scripts/gen-notice.py
      - name: The third-party notice must be regenerated and committed
        run: |
          drift="$(git status --porcelain -- NOTICE)"
          if [ -n "$drift" ]; then
            echo "The third-party notice is stale:" >&2
            echo "$drift" >&2
            echo "Run python3 scripts/gen-notice.py and commit the result." >&2
            exit 1
          fi

  # Each crate's README is generated from its doc comment; fail if a committed
  # README is stale (the doc changed but scripts/gen-readmes.sh was not re-run).
  readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-readme
      - run: bash scripts/gen-readmes.sh
      # `git status`, not `git diff`: a new crate's README is untracked, and
      # `git diff` does not see untracked files.
      - name: Per-crate READMEs must be regenerated and committed
        run: |
          drift="$(git status --porcelain -- 'crates/*/README.md')"
          if [ -n "$drift" ]; then
            echo "These crate READMEs are stale or missing from git:" >&2
            echo "$drift" >&2
            echo "Run scripts/gen-readmes.sh and commit the result." >&2
            exit 1
          fi
