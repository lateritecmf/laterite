name: SQLite

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request supersedes the run still going
# for the older one, which is cancelled: only the newest commit's result is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The full workspace suite on an in-memory SQLite database (the default when
# LATERITE_TEST_DATABASE_URL is unset). The one service is a Redis, for the
# cache's `redis` store; the test skips itself when the URL is unset.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LATERITE_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features sqlite
      - run: cargo test -p laterite-core --features sqlite,redis,testing --test cache_redis
