[workspace]
resolver = "2"
members = ["crates/macros", "crates/core", "crates/auth", "crates/cli", "crates/admin", "crates/web"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lateritecmf/laterite"

[workspace.dependencies]
# Path plus version: the path is used for local builds within the workspace, and
# the version is what cargo emits as the crates.io dependency when publishing.
laterite-core = { path = "crates/core", version = "0.2.0" }
laterite-macros = { path = "crates/macros", version = "0.2.0" }
laterite-auth = { path = "crates/auth", version = "0.2.0" }
laterite-admin = { path = "crates/admin", version = "0.2.0" }
laterite-web = { path = "crates/web", version = "0.2.0" }
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
askama = "0.13"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde", "unstable-locales"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
listenfd = "1"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sea-query = { version = "0.32", features = [
    "backend-postgres",
    "backend-mysql",
    "backend-sqlite",
    "derive",
] }
# Backend drivers (postgres/mysql/sqlite) are not enabled here: each is turned on
# by a laterite-core feature so a deployment compiles only the driver it uses.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "any",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
