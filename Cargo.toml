[workspace]
resolver = "2"
members = ["crates/macros", "crates/core", "crates/auth", "crates/cli", "crates/admin", "crates/media", "crates/web", "crates/lateritecmf"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lateritecmf/laterite"

[workspace.dependencies]
# Path plus version: the path is used for local builds within the workspace, and
# the version is what cargo emits as the crates.io dependency when publishing.
laterite-core = { path = "crates/core", version = "0.9.27" }
laterite-media = { path = "crates/media", version = "0.9.27" }
laterite-macros = { path = "crates/macros", version = "0.9.27" }
laterite-auth = { path = "crates/auth", version = "0.9.27" }
laterite-admin = { path = "crates/admin", version = "0.9.27" }
laterite-web = { path = "crates/web", version = "0.9.27" }
lateritecmf = { path = "crates/lateritecmf", version = "0.9.27" }
anyhow = "1"
ammonia = "4.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
argon2 = "0.5"
async-trait = "0.1"
askama = "0.13"
# `multipart` for file uploads (the bulk importer); a plain form needs none.
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
bytes = "1"
# axum-extra re-exports Cookie but not the `time` types its max_age takes, so
# the crate behind it is a direct dependency.
cookie = "0.18"
ipnet = "2"
blake3 = "1"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
secrecy = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "unstable-locales"] }
futures = "0.3"
chrono-tz = "0.10"
croner = "4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "pool", "hostname", "ring", "webpki-roots"] }
css-inline = { version = "0.23", default-features = false }
minijinja = { version = "3", features = ["serde", "multi_template"] }
iana-time-zone = "0.1"
listenfd = "1"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
rand = "0.8"
moka = { version = "0.12", features = ["future"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
regex = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# YAML for descriptor files. serde_yaml was archived in 2024; saphyr is the
# maintained successor (YAML 1.2 with 1.1 compatibility).
serde-saphyr = "1.3"
sha2 = "0.10"
hmac = "0.12"
# Image decoding and encoding for media variants, without the AVIF stack.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Lossless metadata stripping: EXIF leaves a JPEG, PNG or WebP without a re-encode.
img-parts = "0.4"
# The S3-compatible storage driver, behind the media crate's `s3` feature.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
sea-query = { version = "0.32", features = [
    "backend-postgres",
    "backend-mysql",
    "backend-sqlite",
    "derive",
] }
# Backend drivers (postgres/mysql/sqlite) are not enabled here: each is turned on
# by a laterite-core feature so a deployment compiles only the driver it uses.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "any",
] }
csv = "1"
tempfile = "3"
unicode-normalization = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
